[package]
name = "mgf-splash-app"
version = "0.1.0"
edition = "2024"
description = "Browser-side MGF to SPLASH conversion with Dioxus and WebAssembly."
readme = "README.md"
license = "MIT"
repository = "https://github.com/LucaCappelletti94/mgf-splash-app"
keywords = ["mass-spectrometry", "mgf", "splash", "wasm", "dioxus"]
categories = ["science", "wasm", "web-programming"]

[workspace]
members = ["worker"]

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"
warnings = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
expect_used = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
implicit_clone = "deny"
indexing_slicing = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
str_to_string = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
wildcard_imports = "deny"
multiple_crate_versions = "allow"

[lints]
workspace = true

[features]
default = ["web"]
web = [
    "dep:dioxus",
    "dioxus/web",
    "dep:dioxus-free-icons",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "web-sys/Blob",
    "web-sys/Document",
    "web-sys/Element",
    "web-sys/ErrorEvent",
    "web-sys/HtmlAnchorElement",
    "web-sys/HtmlElement",
    "web-sys/MessageEvent",
    "web-sys/Node",
    "web-sys/Url",
    "web-sys/Window",
    "web-sys/Worker",
    "web-sys/WorkerOptions",
    "web-sys/WorkerType",
]

[dependencies]
dioxus = { version = "=0.7.7", optional = true }
dioxus-free-icons = { version = "0.10.0", features = ["font-awesome-brands", "lucide"], optional = true }
js-sys = { version = "0.3.97", optional = true }
mascot-rs = { git = "https://github.com/LucaCappelletti94/mascot-rs", rev = "4ca85ec431cfb3f24b7eb44f41fd15e225b2d3e3", default-features = false }
mass_spectrometry = { git = "https://github.com/earth-metabolome-initiative/mass-spectrometry-traits", rev = "5010a2a1c4dbf8d1898b8319b2108ea810be1767", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
wasm-bindgen = { version = "0.2.120", optional = true }
web-sys = { version = "0.3.97", optional = true }

[build-dependencies]
wasm-bindgen-cli-support = "0.2.120"

[profile.wasm-dev]
inherits = "dev"
debug = 0
